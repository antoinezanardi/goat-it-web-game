name: Acceptance Tests 🥒
description: Run E2E acceptance tests and upload reports.
author: Antoine ZANARDI

inputs:
  acceptance-tests-reports-path:
    description: Path to acceptance tests reports (Cucumber JSON and HTML reports).
    required: true
    default: tests/acceptance/reports

outputs:
  acceptance-tests-count:
    description: Number of acceptance tests (scenarios) executed.
    value: ${{ steps.cucumber-results.outputs.acceptance-tests-count }}

runs:
  using: composite
  steps:
    - name: Install project 📦
      uses: ./.github/actions/install-project

    - name: Get Playwright version 🎭
      id: playwright-version
      shell: bash
      run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers cache 🥡
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Prepare acceptance environment 🧰
      shell: bash
      run: |
        pnpm run docker:api-sandbox:start &
        SANDBOX_PID=$!
        pnpm run test:acceptance:build &
        BUILD_PID=$!

        pnpm exec playwright install --only-shell chromium
        if ! node -e "require('playwright-core').chromium.launch({ headless: true }).then(browser => browser.close()).catch(error => { console.error(error); process.exit(1); })"; then
          echo "Chromium is missing system dependencies, installing them..."
          timeout 300 pnpm exec playwright install-deps chromium
          node -e "require('playwright-core').chromium.launch({ headless: true }).then(browser => browser.close())"
        fi

        BUILD_STATUS=0
        SANDBOX_STATUS=0
        wait "$BUILD_PID" || BUILD_STATUS=$?
        wait "$SANDBOX_PID" || SANDBOX_STATUS=$?
        if (( BUILD_STATUS != 0 || SANDBOX_STATUS != 0 )); then
          echo "Acceptance environment preparation failed (build=$BUILD_STATUS, sandbox=$SANDBOX_STATUS)." >&2
          exit 1
        fi

    - name: Acceptance tests ⚗️
      id: acceptance-tests
      continue-on-error: true
      shell: bash
      run: |
        set +e
        pnpm run test:acceptance:skip-build
        ACCEPTANCE_EXIT_CODE=$?
        set -e
        ${{ github.workspace }}/scripts/transform-cucumber-report-as-env-variables.sh >> "$GITHUB_ENV"
        exit "$ACCEPTANCE_EXIT_CODE"

    - name: Set Cucumber Results As Outputs 📝
      id: cucumber-results
      continue-on-error: true
      shell: bash
      run: echo "acceptance-tests-count=${{ env.CUCUMBER_SCENARIOS_COUNT }}" >> "$GITHUB_OUTPUT"

    - name: Save acceptance tests reports as artifact 💎
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: acceptance-tests-reports
        path: ${{ inputs.acceptance-tests-reports-path }}
        if-no-files-found: ignore
        retention-days: 2

    - name: Exit with error if acceptance tests failed 🚨
      if: steps.acceptance-tests.outcome != 'success'
      shell: bash
      run: exit 1
