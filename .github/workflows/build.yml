name: ⚙️ Build Workflow
on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  NUXT_PUBLIC_SITE_URL: ${{ github.base_ref == 'develop' && vars.PREPRODUCTION_SITE_URL || vars.PRODUCTION_SITE_URL }}
  NUXT_SITE_ENV: ${{ github.base_ref == 'develop' && 'staging' || 'production' }}

jobs:
  code-ql:
    name: CodeQL Scan ❇️
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Perform CodeQL Analysis ❇️
        uses: ./.github/actions/code-ql

  lint-workflows:
    name: Lint GitHub Workflows 🐙
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint GitHub Workflows 🐙
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          matcher: true
          fail-on-error: true
          shellcheck: true
          pyflakes: true
          cache: true
          group-result: true

  install:
    name: Install ⚙️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install project 📦
        uses: ./.github/actions/install-project

  docker-builds:
    name: Docker Build 🐳
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NUXT_PUBLIC_DEFAULT_LOCALE: ${{ github.base_ref == 'develop' && vars.PREPRODUCTION_DEFAULT_LOCALE || vars.PRODUCTION_DEFAULT_LOCALE }}
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker Build 🐳
        uses: ./.github/actions/docker-build
        with:
          platform: ${{ matrix.platform }}

  build:
    name: Build App ✨
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - install
    env:
      NUXT_PUBLIC_DEFAULT_LOCALE: ${{ github.base_ref == 'develop' && vars.PREPRODUCTION_DEFAULT_LOCALE || vars.PRODUCTION_DEFAULT_LOCALE }}
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build application ✨
        uses: ./.github/actions/build
        env:
          NUXT_GOAT_IT_API_BASE_URL: ${{ github.base_ref == 'develop' && secrets.PREPRODUCTION_GOAT_IT_API_BASE_URL || secrets.PRODUCTION_GOAT_IT_API_BASE_URL }}
          NUXT_GOAT_IT_API_GAME_KEY: ${{ github.base_ref == 'develop' && secrets.PREPRODUCTION_GOAT_IT_API_GAME_KEY || secrets.PRODUCTION_GOAT_IT_API_GAME_KEY }}

      - name: Upload PR client bundle 📦
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: size-limit-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/public/_nuxt
          if-no-files-found: error
          retention-days: 1

  base-build:
    name: Build Base Bundle 🧱
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NUXT_PUBLIC_DEFAULT_LOCALE: ${{ github.base_ref == 'develop' && vars.PREPRODUCTION_DEFAULT_LOCALE || vars.PRODUCTION_DEFAULT_LOCALE }}
    steps:
      - name: Checkout base commit 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Build base application ✨
        uses: ./.github/actions/build
        env:
          NUXT_GOAT_IT_API_BASE_URL: ${{ github.base_ref == 'develop' && secrets.PREPRODUCTION_GOAT_IT_API_BASE_URL || secrets.PRODUCTION_GOAT_IT_API_BASE_URL }}
          NUXT_GOAT_IT_API_GAME_KEY: ${{ github.base_ref == 'develop' && secrets.PREPRODUCTION_GOAT_IT_API_GAME_KEY || secrets.PRODUCTION_GOAT_IT_API_GAME_KEY }}

      - name: Upload base client bundle 📦
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: size-limit-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/public/_nuxt
          if-no-files-found: error
          retention-days: 1

  bundle-size:
    name: Bundle Size Budget 📏
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - base-build
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bundle Size Budget 📏
        uses: ./.github/actions/bundle-size
        with:
          pr-artifact-name: size-limit-pr-${{ github.run_id }}-${{ github.run_attempt }}
          base-artifact-name: size-limit-base-${{ github.run_id }}-${{ github.run_attempt }}
          base-ref: ${{ github.base_ref }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  lint-codebase:
    name: Lint Codebase 🔍
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Codebase 🔍
        id: lint-codebase
        uses: ./.github/actions/lint

  audit-dependencies:
    name: Audit Dependencies 🛡️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Audit Dependencies 🛡️
        uses: ./.github/actions/audit-dependencies

  unit-tests:
    name: Unit Tests 🧪
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Unit Tests 🧪
        id: unit-tests
        uses: ./.github/actions/unit-tests

  acceptance-tests:
    name: Acceptance Tests 🥒
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - install
    env:
      NUXT_SITE_ENV: staging
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Acceptance Tests 🥒
        id: acceptance-tests
        uses: ./.github/actions/acceptance-tests

  sonarcloud:
    name: SonarCloud Analysis 🌥️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    needs:
      - unit-tests
    if: github.actor != 'renovate[bot]'
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: SonarCloud Analysis 🌥️
        uses: ./.github/actions/sonarcloud
        with:
          sonarcloud-token: ${{ secrets.SONARCLOUD_TOKEN }}
