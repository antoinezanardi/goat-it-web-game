name: ⚙️ Build Workflow
on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  NUXT_PUBLIC_SITE_URL: ${{ github.base_ref == 'develop' && vars.PREPRODUCTION_SITE_URL || vars.PRODUCTION_SITE_URL }}
  NUXT_SITE_ENV: ${{ github.base_ref == 'develop' && 'staging' || 'production' }}

jobs:
  code-ql:
    name: CodeQL Scan ❇️
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Perform CodeQL Analysis ❇️
        uses: ./.github/actions/code-ql

  lint-workflows:
    name: Lint GitHub Workflows 🐙
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint GitHub Workflows 🐙
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          matcher: true
          fail-on-error: true
          shellcheck: true
          pyflakes: true
          cache: true
          group-result: true

  install:
    name: Install ⚙️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install project 📦
        uses: ./.github/actions/install-project

  docker-builds:
    name: Docker Build 🐳
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NUXT_PUBLIC_DEFAULT_LOCALE: ${{ github.base_ref == 'develop' && vars.PREPRODUCTION_DEFAULT_LOCALE || vars.PRODUCTION_DEFAULT_LOCALE }}
    strategy:
      fail-fast: false
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker Build 🐳
        uses: ./.github/actions/docker-build
        with:
          platform: ${{ matrix.platform }}

  build:
    name: Build App ✨
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - install
    env:
      NUXT_PUBLIC_DEFAULT_LOCALE: ${{ github.base_ref == 'develop' && vars.PREPRODUCTION_DEFAULT_LOCALE || vars.PRODUCTION_DEFAULT_LOCALE }}
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build application ✨
        uses: ./.github/actions/build
        env:
          NUXT_GOAT_IT_API_BASE_URL: ${{ github.base_ref == 'develop' && secrets.PREPRODUCTION_GOAT_IT_API_BASE_URL || secrets.PRODUCTION_GOAT_IT_API_BASE_URL }}
          NUXT_GOAT_IT_API_GAME_KEY: ${{ github.base_ref == 'develop' && secrets.PREPRODUCTION_GOAT_IT_API_GAME_KEY || secrets.PRODUCTION_GOAT_IT_API_GAME_KEY }}

      - name: Upload PR client bundle 📦
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: size-limit-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/public/_nuxt
          if-no-files-found: error
          retention-days: 1

  base-build:
    name: Build Base Bundle 🧱
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NUXT_PUBLIC_DEFAULT_LOCALE: ${{ github.base_ref == 'develop' && vars.PREPRODUCTION_DEFAULT_LOCALE || vars.PRODUCTION_DEFAULT_LOCALE }}
    steps:
      - name: Checkout base commit 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Build base application ✨
        uses: ./.github/actions/build
        env:
          NUXT_GOAT_IT_API_BASE_URL: ${{ github.base_ref == 'develop' && secrets.PREPRODUCTION_GOAT_IT_API_BASE_URL || secrets.PRODUCTION_GOAT_IT_API_BASE_URL }}
          NUXT_GOAT_IT_API_GAME_KEY: ${{ github.base_ref == 'develop' && secrets.PREPRODUCTION_GOAT_IT_API_GAME_KEY || secrets.PRODUCTION_GOAT_IT_API_GAME_KEY }}

      - name: Upload base client bundle 📦
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: size-limit-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/public/_nuxt
          if-no-files-found: error
          retention-days: 1

  bundle-size:
    name: Bundle Size Budget 📏
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - base-build
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare bundle-size workspace 🗂️
        if: ${{ always() }}
        shell: bash
        run: mkdir -p "${{ runner.temp }}/bundle-size"

      - name: Download PR client bundle 📩
        id: download-pr
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: size-limit-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle-size/pr

      - name: Download base client bundle 📩
        id: download-base
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: size-limit-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle-size/base

      - name: Install project 📦
        uses: ./.github/actions/install-project

      - name: Measure PR bundle 📏
        continue-on-error: true
        shell: bash
        env:
          PR_JSON: ${{ runner.temp }}/bundle-size/pr.json
          SIZE_LIMIT_OUTPUT_DIR: ${{ runner.temp }}/bundle-size/pr
        run: |
          status=0
          pnpm exec size-limit --config configs/size-limit/size-limit.config.ts --json > "$PR_JSON" || status=$?
          echo "PR Size Limit exit code: $status"

      - name: Measure base bundle 📏
        continue-on-error: true
        shell: bash
        env:
          BASE_JSON: ${{ runner.temp }}/bundle-size/base.json
          SIZE_LIMIT_OUTPUT_DIR: ${{ runner.temp }}/bundle-size/base
        run: |
          status=0
          pnpm exec size-limit --config configs/size-limit/size-limit.config.ts --json > "$BASE_JSON" || status=$?
          echo "Base Size Limit exit code: $status"

      - name: Compare bundles and write summary 📊
        if: ${{ always() }}
        shell: bash
        env:
          PR_JSON: ${{ runner.temp }}/bundle-size/pr.json
          BASE_JSON: ${{ runner.temp }}/bundle-size/base.json
          PR_DOWNLOAD_OUTCOME: ${{ steps.download-pr.outcome }}
          BASE_DOWNLOAD_OUTCOME: ${{ steps.download-base.outcome }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";

          const CHECKS = [
            { key: "nuxt-js", label: "JavaScript (`nuxt-js`)" },
            { key: "nuxt-css", label: "CSS (`nuxt-css`)" },
          ];

          const summaryPath = process.env.GITHUB_STEP_SUMMARY ?? "/dev/stdout";
          const prJsonPath = process.env.PR_JSON;
          const baseJsonPath = process.env.BASE_JSON;
          const baseRef = process.env.BASE_REF ?? "unknown";
          const baseSha = process.env.BASE_SHA ?? "unknown";
          const headSha = process.env.HEAD_SHA ?? "unknown";

          function writeSummary(markdown) {
            appendFileSync(summaryPath, `${markdown}\n`);
          }

          function abort(message) {
            writeSummary(`## 📏 Bundle Size Budget\n\n**Comparison unavailable.**\n\n${message}\n`);
            process.exit(1);
          }

          function formatInteger(value) {
            return new Intl.NumberFormat("en-US").format(value);
          }

          function formatBytes(bytes) {
            const absolute = Math.abs(bytes);
            if (absolute >= 1024 * 1024) {
              return `${(bytes / (1024 * 1024)).toFixed(2)} MiB`;
            }
            if (absolute >= 1024) {
              return `${(bytes / 1024).toFixed(1)} KiB`;
            }
            return `${formatInteger(bytes)} B`;
          }

          function formatSignedBytes(value) {
            return `${value > 0 ? "+" : ""}${formatInteger(value)} B`;
          }

          function formatPercent(delta, base) {
            if (base === 0) {
              return "N/A";
            }
            const percent = (delta / base) * 100;
            return `${percent > 0 ? "+" : ""}${percent.toFixed(2)}%`;
          }

          function parseMeasurements(filePath, side) {
            if (!filePath || !existsSync(filePath)) {
              return { error: `${side}: the Size Limit result file is missing.` };
            }
            let raw;
            try {
              raw = readFileSync(filePath, "utf8").trim();
            } catch (error) {
              return { error: `${side}: the Size Limit result file could not be read (${error.message}).` };
            }
            if (raw.length === 0) {
              return { error: `${side}: the Size Limit result file is empty.` };
            }
            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (error) {
              return { error: `${side}: Size Limit emitted invalid JSON (${error.message}).` };
            }
            if (!Array.isArray(parsed)) {
              if (parsed && typeof parsed === "object" && "error" in parsed) {
                return { error: `${side}: Size Limit returned an error object instead of a result array. Size Limit reported: ${parsed.error}` };
              }
              return { error: `${side}: Size Limit returned a non-array result instead of a result array.` };
            }
            if (parsed.length !== CHECKS.length) {
              return { error: `${side}: expected exactly ${CHECKS.length} results, received ${parsed.length}.` };
            }
            const checks = new Map();
            for (const entry of parsed) {
              if (!entry || typeof entry !== "object" || Array.isArray(entry)) {
                return { error: `${side}: a result entry is not an object.` };
              }
              if (typeof entry.name !== "string" || !CHECKS.some(({ key }) => key === entry.name)) {
                return { error: `${side}: unexpected result name "${String(entry.name)}".` };
              }
              if (checks.has(entry.name)) {
                return { error: `${side}: duplicate result name "${entry.name}".` };
              }
              if (typeof entry.size !== "number" || !Number.isFinite(entry.size) || entry.size < 0) {
                return { error: `${side}: "${entry.name}" has an invalid size.` };
              }
              if (entry.size === 0) {
                return { error: `${side}: "${entry.name}" measured 0 bytes; its glob matched no files.` };
              }
              if (typeof entry.sizeLimit !== "number" || !Number.isFinite(entry.sizeLimit) || entry.sizeLimit <= 0) {
                return { error: `${side}: "${entry.name}" has no valid absolute cap.` };
              }
              if (typeof entry.passed !== "boolean") {
                return { error: `${side}: "${entry.name}" has no boolean pass state.` };
              }
              checks.set(entry.name, entry);
            }
            for (const { key } of CHECKS) {
              if (!checks.has(key)) {
                return { error: `${side}: missing result for "${key}".` };
              }
            }
            return { checks };
          }

          function buildTable(prChecks, baseChecks) {
            const lines = [
              "| Asset | Base (Brotli) | PR (Brotli) | Δ bytes | Δ % | Cap | PR headroom | PR status |",
              "| --- | ---: | ---: | ---: | ---: | ---: | ---: | :---: |",
            ];
            for (const { key, label } of CHECKS) {
              const base = baseChecks.get(key);
              const pr = prChecks.get(key);
              const delta = pr.size - base.size;
              const headroom = pr.sizeLimit - pr.size;
              const headroomText = headroom >= 0
                ? `${formatInteger(headroom)} B headroom`
                : `${formatInteger(Math.abs(headroom))} B over cap`;
              lines.push(
                `| ${label} | ${formatInteger(base.size)} B (${formatBytes(base.size)}) | ${formatInteger(pr.size)} B (${formatBytes(pr.size)}) | ${formatSignedBytes(delta)} | ${formatPercent(delta, base.size)} | ${formatInteger(pr.sizeLimit)} B (${formatBytes(pr.sizeLimit)}) | ${headroomText} | ${pr.passed ? "✅ pass" : "❌ fail"} |`,
              );
            }
            return lines.join("\n");
          }

          const downloadFailures = [];
          if (process.env.PR_DOWNLOAD_OUTCOME !== "success") {
            downloadFailures.push("the PR client-bundle artifact was not downloaded.");
          }
          if (process.env.BASE_DOWNLOAD_OUTCOME !== "success") {
            downloadFailures.push("the base client-bundle artifact was not downloaded.");
          }
          if (downloadFailures.length > 0) {
            abort(downloadFailures.join(" "));
          }

          const pr = parseMeasurements(prJsonPath, "PR");
          if (pr.error) {
            abort(pr.error);
          }
          const base = parseMeasurements(baseJsonPath, "Base");
          if (base.error) {
            abort(base.error);
          }

          const prChecks = pr.checks;
          const baseChecks = base.checks;
          const prFailures = CHECKS.filter(({ key }) => !prChecks.get(key).passed);
          const baseFailures = CHECKS.filter(({ key }) => !baseChecks.get(key).passed);

          const lines = [
            "## 📏 Bundle Size Budget",
            "",
            `**PR head:** \`${headSha}\` · **Target branch:** \`${baseRef}\` · **Base commit:** \`${baseSha}\``,
            "",
            buildTable(prChecks, baseChecks),
          ];

          if (baseFailures.length > 0) {
            lines.push(
              "",
              `> Base measurement exceeds its cap for ${baseFailures.map(({ key }) => `\`${key}\``).join(", ")}. This is informational and does not fail the gate.`,
            );
          }

          lines.push(
            "",
            prFailures.length === 0
              ? "**Result:** PR bundle is within both absolute caps."
              : `**Result:** PR bundle exceeds the absolute cap for ${prFailures.map(({ key }) => `\`${key}\``).join(", ")}.`,
          );

          writeSummary(lines.join("\n"));

          if (prFailures.length > 0) {
            process.exitCode = 1;
          }
          NODE

      - name: Upload bundle-size measurements 📦
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: size-limit-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle-size/*.json
          if-no-files-found: ignore
          retention-days: 1

  lint-codebase:
    name: Lint Codebase 🔍
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Codebase 🔍
        id: lint-codebase
        uses: ./.github/actions/lint

  audit-dependencies:
    name: Audit Dependencies 🛡️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Audit Dependencies 🛡️
        uses: ./.github/actions/audit-dependencies

  unit-tests:
    name: Unit Tests 🧪
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - install
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Unit Tests 🧪
        id: unit-tests
        uses: ./.github/actions/unit-tests

  acceptance-tests:
    name: Acceptance Tests 🥒
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - install
    env:
      NUXT_SITE_ENV: staging
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Acceptance Tests 🥒
        id: acceptance-tests
        uses: ./.github/actions/acceptance-tests

  sonarcloud:
    name: SonarCloud Analysis 🌥️
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    needs:
      - unit-tests
    if: github.actor != 'renovate[bot]'
    steps:
      - name: Checkout GitHub repository 📡
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: SonarCloud Analysis 🌥️
        uses: ./.github/actions/sonarcloud
        with:
          sonarcloud-token: ${{ secrets.SONARCLOUD_TOKEN }}
