overrides:
  conventional-changelog-writer: ^9.3.0
  eslint-plugin-import-x: 4.17.1
  unhead: ^3.4.3
  vite: ^8.3.4

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

peerDependencyRules:
  allowedVersions:
    vite: "8"
supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
minimumReleaseAge: 0
