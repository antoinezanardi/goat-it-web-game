overrides:
  conventional-changelog-writer: ^9.3.0
  eslint-plugin-import-x: 4.17.1
  unhead: ^3.4.3
  vite: ^8.3.4

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

peerDependencyRules:
  allowedVersions:
    vite: "8"
supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "pnpm"
  - "@pnpm/*"
  - "@goat-it/schemas"
  - "@iconify-json/lucide@1.2.145"
  - "@nuxt/ui@4.12.0"
  - "@pinia/nuxt@1.0.3"
  - "@pinia/testing@2.0.2"
  - "@playwright/test@1.64.1"
  - "@tanstack/virtual-core@3.19.5"
  - "@tanstack/vue-virtual@3.13.46"
  - "@vitest/coverage-v8@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - "eslint-plugin-oxlint@1.88.0"
  - "framer-motion@14.3.0"
  - "happy-dom@21.0.3"
  - "motion-dom@14.3.0"
  - "motion-v@2.8.0"
  - "pinia@4.1.0"
  - "playwright-core@1.64.1"
  - "playwright@1.64.1"
  - "vitest@5.0.5"
