# This docker-compose file is used to run the goat-it-api in a sandbox environment.
# Useful for testing and development purposes.
# 4 instances are defined to support parallel acceptance test execution.

services:
  api-0:
    image: antoinezanardi/goat-it-api:develop@sha256:d73f9acf32c412843879a6dd8a4522d0dcc25ad92af927d9ac5c11c1c9a33521
    container_name: goat-it-api-sandbox-0
    depends_on:
      mongodb-0:
        condition: service_healthy
    environment:
      ENVIRONMENT: "production"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "9090"
      MONGODB_HOST: "goat-it-api-sandbox-mongodb-0"
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: "goat-it-sandbox"
      API_KEY_HMAC_SECRET: "test_hmac_secret_key_for_api_key_signing_1234"
      ADMIN_API_KEY: "test_admin_api_key_for_testing"
      GAME_API_KEY: "test_game_api_key_for_testing"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  mongodb-0:
    container_name: goat-it-api-sandbox-mongodb-0
    image: mongo:9@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    ports:
      - "127.0.0.1:27117:27017"
    volumes:
      - goat-it-api-sandbox-mongodb-0-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api-1:
    image: antoinezanardi/goat-it-api:develop@sha256:d73f9acf32c412843879a6dd8a4522d0dcc25ad92af927d9ac5c11c1c9a33521
